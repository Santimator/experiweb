<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
<title>Save the Coconuts</title>

<style>
html, body {
  margin:0;
  padding:0;
  height:100%;
  background:#0f0f0f;
  font-family:monospace;
  color:white;
  overflow:hidden;
  touch-action:manipulation;
}

body{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

h1{
  margin-bottom:20px;
  letter-spacing:2px;
  font-size:20px;
}

/* PCB BOARD */
.microbit{
  background:#0f3b2e;
  padding:30px;
  border-radius:40px;
  box-shadow:0 0 40px #000 inset;
}

.board{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:30px;
}

/* LED PANEL */
.led-container{
  background:#082a20;
  padding:20px;
  border-radius:20px;
}

.led-grid{
  display:grid;
  grid-template-columns:repeat(5,18px);
  grid-template-rows:repeat(5,26px);
  gap:8px;
}

/* VERTICAL RECTANGLE LED */
.led{
  width:18px;
  height:26px;
  border-radius:3px;
  background:#220000;
}

.led.on{
  background:#ff3b00;
  box-shadow:0 0 8px #ff3b00;
}

/* BUTTONS */
.btn{
  width:65px;
  height:65px;
  border-radius:50%;
  background:#2a2a2a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  user-select:none;
  touch-action:none;
}

.btn:active{
  background:#444;
}

.hint{
  margin-top:15px;
  font-size:12px;
  opacity:0.7;
  display:none;
}
</style>
</head>
<body>

<h1>Save the Coconuts</h1>

<div class="microbit">
  <div class="board">
    <div id="btnA" class="btn">A</div>

    <div class="led-container">
      <div id="grid" class="led-grid"></div>
    </div>

    <div id="btnB" class="btn">B</div>
  </div>

  <div id="hint" class="hint">
    (press A to restart the game)
  </div>
</div>

<script>
const size=5;
const grid=document.getElementById("grid");
const hint=document.getElementById("hint");

let leds=[];
let basketX, fallingX, fallingY, speed, score;
let gameOver=false;
let scrolling=false;

function createGrid(){
  for(let i=0;i<size*size;i++){
    const d=document.createElement("div");
    d.className="led";
    grid.appendChild(d);
    leds.push(d);
  }
}

function idx(x,y){return y*size+x;}
function clearGrid(){leds.forEach(l=>l.classList.remove("on"));}

function draw(){
  if(gameOver || scrolling) return;
  clearGrid();
  leds[idx(basketX,size-1)].classList.add("on");
  if(fallingX!==null)
    leds[idx(fallingX,fallingY)].classList.add("on");
}

function spawn(){
  fallingX=Math.floor(Math.random()*size);
  fallingY=0;
}

function step(){
  if(gameOver) return;

  if(fallingY===null) spawn();
  else fallingY++;

  if(fallingY===size-1){
    if(fallingX===basketX){
      score++;
      speed*=0.93;
      fallingX=null;
      fallingY=null;
    }else{
      endGame();
      return;
    }
  }

  draw();
  setTimeout(step,speed);
}

/* WRAP AROUND MOVEMENT */
function moveLeft(){
  if(gameOver) return;
  basketX = (basketX - 1 + size) % size;
  draw();
}

function moveRight(){
  if(gameOver) return;
  basketX = (basketX + 1) % size;
  draw();
}

function endGame(){
  gameOver=true;
  hint.style.display="block";
  scrollScore(score.toString());
}

function restartGame(){
  scrolling=false;
  gameOver=false;
  hint.style.display="none";
  basketX=2;
  fallingX=null;
  fallingY=null;
  speed=600;
  score=0;
  clearGrid();
  spawn();
  setTimeout(step,speed);
}

/* MARQUEE SCROLL (enters from right, exits left) */
function scrollScore(text){
  scrolling=true;

  const font={
    "0":["111","101","101","101","111"],
    "1":["010","110","010","010","111"],
    "2":["111","001","111","100","111"],
    "3":["111","001","111","001","111"],
    "4":["101","101","111","001","001"],
    "5":["111","100","111","001","111"],
    "6":["111","100","111","101","111"],
    "7":["111","001","001","001","001"],
    "8":["111","101","111","101","111"],
    "9":["111","101","111","001","111"]
  };

  let cols=[];

  /* leading blank space so it enters from right */
  for(let i=0;i<5;i++) cols.push([0,0,0,0,0]);

  text.split("").forEach(c=>{
    const p=font[c];
    for(let x=0;x<3;x++){
      let col=[];
      for(let y=0;y<5;y++)
        col.push(p[y][x]==="1");
      cols.push(col);
    }
    cols.push([0,0,0,0,0]);
  });

  /* trailing blank so it exits left */
  for(let i=0;i<5;i++) cols.push([0,0,0,0,0]);

  let offset=0;

  function loop(){
    if(!scrolling) return;

    clearGrid();

    for(let x=0;x<5;x++){
      let col=cols[x+offset];
      if(!col) continue;
      for(let y=0;y<5;y++)
        if(col[y]) leds[idx(x,y)].classList.add("on");
    }

    offset++;

    if(offset<=cols.length-5){
      setTimeout(loop,120);
    } else {
      offset=0;
      setTimeout(loop,600);
    }
  }

  loop();
}

function attachButton(el, side){
  el.addEventListener("touchstart",e=>{
    e.preventDefault();

    if(gameOver){
      if(side==="left") restartGame();
      return;
    }

    if(side==="left") moveLeft();
    else moveRight();

  },{passive:false});
}

attachButton(document.getElementById("btnA"),"left");
attachButton(document.getElementById("btnB"),"right");

document.addEventListener("keydown",e=>{
  if(gameOver && e.key==="ArrowLeft") restartGame();
  if(!gameOver){
    if(e.key==="ArrowLeft") moveLeft();
    if(e.key==="ArrowRight") moveRight();
  }
});

document.addEventListener('gesturestart', function (e) {
  e.preventDefault();
});

createGrid();
restartGame();
</script>

</body>
</html>
