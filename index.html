<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Save the Coconuts</title>
<style>
body{
  background:#0f0f0f;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  margin:0;
  font-family:monospace;
  color:white;
}

h1{
  margin-bottom:20px;
  letter-spacing:2px;
}

.microbit{
  background:#1c1c1c;
  padding:40px;
  border-radius:40px;
  position:relative;
  box-shadow:0 0 40px #000 inset;
}

.board{
  display:flex;
  align-items:center;
  gap:40px;
}

.led-container{
  background:#111;
  padding:20px;
  border-radius:20px;
}

.led-grid{
  display:grid;
  grid-template-columns:repeat(5,24px);
  grid-template-rows:repeat(5,24px);
  gap:10px;
}

.led{
  width:24px;
  height:24px;
  border-radius:50%;
  background:#320000;
}

.led.on{
  background:red;
  box-shadow:0 0 8px red;
}

.btn{
  width:70px;
  height:70px;
  border-radius:50%;
  background:#444;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  user-select:none;
}

.btn:active{
  background:#666;
}

.hint{
  margin-top:15px;
  font-size:12px;
  opacity:0.7;
  display:none;
}
</style>
</head>
<body>

<h1>Save the Coconuts</h1>

<div class="microbit">
  <div class="board">
    <div id="btnA" class="btn">A</div>

    <div class="led-container">
      <div id="grid" class="led-grid"></div>
    </div>

    <div id="btnB" class="btn">B</div>
  </div>

  <div id="hint" class="hint">
    (press two buttons simultaneously to restart the game)
  </div>
</div>

<script>
const size=5;
const grid=document.getElementById("grid");
const hint=document.getElementById("hint");
let leds=[];
let basketX, fallingX, fallingY, speed, score;
let gameOver=false;
let scrolling=false;
let leftPressed=false;
let rightPressed=false;

function createGrid(){
  grid.innerHTML="";
  leds=[];
  for(let i=0;i<size*size;i++){
    const d=document.createElement("div");
    d.classList.add("led");
    grid.appendChild(d);
    leds.push(d);
  }
}

function idx(x,y){return y*size+x;}
function clearGrid(){leds.forEach(l=>l.classList.remove("on"));}

function draw(){
  if(gameOver || scrolling) return;
  clearGrid();
  leds[idx(basketX,size-1)].classList.add("on");
  if(fallingX!==null)
    leds[idx(fallingX,fallingY)].classList.add("on");
}

function spawn(){
  fallingX=Math.floor(Math.random()*size);
  fallingY=0;
}

function step(){
  if(gameOver) return;

  if(fallingY===null) spawn();
  else fallingY++;

  if(fallingY===size-1){
    if(fallingX===basketX){
      score++;
      speed*=0.93;
      fallingX=null;
      fallingY=null;
    }else{
      endGame();
      return;
    }
  }

  draw();
  setTimeout(step,speed);
}

function moveLeft(){
  if(gameOver) return;
  if(basketX>0) basketX--;
  draw();
}

function moveRight(){
  if(gameOver) return;
  if(basketX<size-1) basketX++;
  draw();
}

function endGame(){
  gameOver=true;
  hint.style.display="block";
  scrollScore(score.toString());
}

function restartGame(){
  if(!gameOver) return;
  gameOver=false;
  scrolling=false;
  hint.style.display="none";
  basketX=2;
  fallingX=null;
  fallingY=null;
  speed=600;
  score=0;
  draw();
  spawn();
  setTimeout(step,speed);
}

function scrollScore(text){
  scrolling=true;
  const font={
    "0":["111","101","101","101","111"],
    "1":["010","110","010","010","111"],
    "2":["111","001","111","100","111"],
    "3":["111","001","111","001","111"],
    "4":["101","101","111","001","001"],
    "5":["111","100","111","001","111"],
    "6":["111","100","111","101","111"],
    "7":["111","001","001","001","001"],
    "8":["111","101","111","101","111"],
    "9":["111","101","111","001","111"]
  };

  let cols=[];
  text.split("").forEach(c=>{
    const p=font[c];
    for(let x=0;x<3;x++){
      let col=[];
      for(let y=0;y<5;y++) col.push(p[y][x]==="1");
      cols.push(col);
    }
    cols.push([0,0,0,0,0]);
  });
  cols=cols.concat(Array(5).fill([0,0,0,0,0]));

  let offset=0;
  function loop(){
    if(!scrolling) return;
    clearGrid();
    for(let x=0;x<5;x++){
      let col=cols[x+offset];
      if(!col) continue;
      for(let y=0;y<5;y++)
        if(col[y]) leds[idx(x,y)].classList.add("on");
    }
    offset++;
    if(offset<cols.length-5)
      setTimeout(loop,120);
    else
      setTimeout(()=>{offset=0;loop();},600);
  }
  loop();
}

function checkRestart(){
  if(leftPressed && rightPressed)
    restartGame();
}

document.getElementById("btnA").addEventListener("pointerdown",()=>{
  leftPressed=true;
  if(!gameOver) moveLeft();
  checkRestart();
});
document.getElementById("btnA").addEventListener("pointerup",()=>leftPressed=false);

document.getElementById("btnB").addEventListener("pointerdown",()=>{
  rightPressed=true;
  if(!gameOver) moveRight();
  checkRestart();
});
document.getElementById("btnB").addEventListener("pointerup",()=>rightPressed=false);

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"){
    leftPressed=true;
    if(!gameOver) moveLeft();
    checkRestart();
  }
  if(e.key==="ArrowRight"){
    rightPressed=true;
    if(!gameOver) moveRight();
    checkRestart();
  }
});

document.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft") leftPressed=false;
  if(e.key==="ArrowRight") rightPressed=false;
});

createGrid();
restartGame();
</script>

</body>
</html>
