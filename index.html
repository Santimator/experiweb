<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a0a00">
    <title>Carrom Board</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div id="game-container">
        <div id="scoreboard">
            <div class="player-score active" id="player1-score">
                <span class="player-label">Player 1</span>
                <div class="score-pieces" id="p1-pieces"></div>
                <span class="score-value" id="p1-value">0</span>
            </div>
            <div id="turn-indicator">
                <span id="turn-text">Player 1</span>
            </div>
            <div class="player-score" id="player2-score">
                <span class="player-label">Player 2</span>
                <div class="score-pieces" id="p2-pieces"></div>
                <span class="score-value" id="p2-value">0</span>
            </div>
        </div>
        <canvas id="carromCanvas"></canvas>
        <div id="controls">
            <button id="btn-new-game">New Game</button>
            <button id="btn-mode">2 Players</button>
        </div>
    </div>
    <div id="overlay">
        <div id="overlay-content">
            <h2 id="overlay-title">Carrom</h2>
            <p id="overlay-message">Drag to place the striker, then pull back and release to shoot!</p>
            <button id="overlay-btn">Play</button>
        </div>
    </div>
    <script src="script.js?v=2"></script>
</body>
</html>
