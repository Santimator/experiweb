<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiesta Gatuna con Antonio - Web de Dani</title>
<style>
    /* Reset rápido */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Comic Sans MS', cursive, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ff69b4, #fff200);
        animation: gradientMove 5s ease infinite alternate;
        overflow: hidden;
    }

    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        100% { background-position: 100% 50%; }
    }

    .container {
        text-align: center;
        padding: 20px;
        border: 5px dashed #ff1493;
        border-radius: 30px;
        background-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 50px rgba(0,0,0,0.2);
        animation: bounce 2s infinite;
    }

    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
    }

    h1 {
        font-size: 3rem;
        color: #ff1493;
        text-shadow: 2px 2px #fff200;
        margin-bottom: 20px;
    }

    img {
        max-width: 100%;
        height: auto;
        border: 8px solid #fff200;
        border-radius: 20px;
        box-shadow: 0 0 20px #ff1493;
        transition: transform 0.3s ease;
    }

    img:hover {
        transform: rotate(15deg) scale(1.1);
    }

    p {
        margin-top: 20px;
        font-size: 1.5rem;
        color: #fff;
        text-shadow: 1px 1px #ff1493;
    }

    /* Confeti animado */
    .confetti {
        position: fixed;
        top: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
    }

    .confetti div {
        position: absolute;
        width: 10px;
        height: 10px;
        background-color: #ff1493;
        opacity: 0.7;
        animation: fall linear infinite;
    }

    @keyframes fall {
        0% { transform: translateY(-10px) rotate(0deg); }
        100% { transform: translateY(100vh) rotate(360deg); }
    }

</style>
</head>
<body>

<div class="container">
    <h1>¡Fiesta Gatuna!</h1>
    <!-- Aquí sustituyes "gatitos.jpg" por tu imagen -->
    <img src="gatitos.jpg" alt="Antonio y gatitos ridículos">
    <p>Antonio y sus compañeros de fiesta te saludan 🐱🎉</p>
</div>

<div class="confetti">
    <!-- Generamos 50 confetis -->
    <script>
        const confettiContainer = document.querySelector('.confetti');
        for(let i=0; i<50; i++){
            let div = document.createElement('div');
            div.style.left = Math.random() * 100 + 'vw';
            div.style.animationDuration = 2 + Math.random()*3 + 's';
            div.style.width = div.style.height = (5 + Math.random()*10) + 'px';
            div.style.backgroundColor = Math.random() > 0.5 ? '#ff1493' : '#fff200';
            confettiContainer.appendChild(div);
        }
    </script>
</div>

</body>
</html>
