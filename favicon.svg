<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff00ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0a0e27"/>

  <!-- Pi symbol -->
  <text x="50" y="65" font-family="serif" font-size="60" font-weight="bold" fill="url(#gradient)" text-anchor="middle">π</text>

  <!-- Decorative dots representing mathematical points -->
  <circle cx="20" cy="20" r="3" fill="#00d9ff" opacity="0.8"/>
  <circle cx="80" cy="20" r="3" fill="#ff00ff" opacity="0.8"/>
  <circle cx="20" cy="80" r="3" fill="#00ff88" opacity="0.8"/>
  <circle cx="80" cy="80" r="3" fill="#ffaa00" opacity="0.8"/>
</svg>
